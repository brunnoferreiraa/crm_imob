name: imobcrm-production

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt:
      - no-new-privileges:true

  backend:
    image: imobcrm-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_NAME: ImobCRM
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?configure SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:?configure FRONTEND_URL}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - property_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    security_opt:
      - no-new-privileges:true

  frontend:
    image: imobcrm-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:8000/api/v1
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    security_opt:
      - no-new-privileges:true

networks:
  internal:

volumes:
  postgres_prod_data:
  property_uploads:
